<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI画图助手</title>
  <link rel="stylesheet" href="styles/common.css">
  <link rel="stylesheet" href="styles/popup.css">
</head>

<body>
  <div class="popup-container">
    <header>
      <h1>🎨 AI画图助手</h1>
    </header>

    <main>
      <div id="inputSection" class="section">
        <textarea id="promptInput" placeholder="输入图片描述..."></textarea>
        <!-- 反向提示词 -->
        <div id="negativePromptGroup" class="input-group" style="display: none; margin-top: 8px;">
          <label for="negativePromptInput"
            style="font-size: 13px; color: #4a5568; margin-bottom: 4px; display: block;">反向提示词 (可选):</label>
          <input type="text" id="negativePromptInput" placeholder="输入反向提示词..."
            style="width: 100%; padding: 8px; border: 1px solid #e2e8f0; border-radius: 6px; font-size: 13px; box-sizing: border-box;">
        </div>
        <!-- 高级参数 -->
        <div id="advancedParamsGroup" class="input-group" style="margin-top: 8px;">
          <button type="button" id="toggleAdvancedParamsBtn" class="toggle-advanced-btn">
            <span class="toggle-icon">▶</span>
            <span>高级参数</span>
          </button>
          <div id="advancedParamsContent" class="advanced-params-content" style="display: none;">
            <div id="advancedParamsList" class="advanced-params-list">
              <!-- 动态加载参数 -->
            </div>
          </div>
        </div>
        <div class="provider-select">
          <label>选择服务商:</label>
          <select id="provider">
            <!-- 动态加载服务商 -->
          </select>
        </div>
        <div id="imageUrlGroup" class="input-group" style="display: none;">
          <label>图片来源:</label>
          <div class="image-source-tabs">
            <button type="button" id="urlTab" class="tab-btn active">输入URL</button>
            <button type="button" id="uploadTab" class="tab-btn">上传图片</button>
            <button type="button" id="historyTab" class="tab-btn">历史记录</button>
          </div>

          <div id="urlSection" class="image-input-section">
            <input type="text" id="imageUrlInput" placeholder="输入要编辑的图片URL...">
          </div>

          <div id="uploadSection" class="image-input-section" style="display: none;">
            <div class="upload-area">
              <input type="file" id="imageFileInput" accept="image/*" style="display: none;">
              <button type="button" id="selectImageBtn" class="btn secondary">📁 选择图片</button>
              <button type="button" id="uploadImageBtn" class="btn secondary" style="display: none;">📤 上传到图床</button>
            </div>
            <div id="uploadStatus" class="upload-status" style="display: none;"></div>
            <div id="imagePreview" class="image-preview" style="display: none;">
              <img id="previewImg" src="" alt="预览图片">
              <button type="button" id="removeImageBtn" class="remove-btn">&times;</button>
            </div>
            <span class="hint">改图服务需要提供图片</span>
          </div>

          <div id="historySection" class="image-input-section" style="display: none;">
            <div id="historyPasswordPrompt" style="display: none;">
              <p class="history-password-hint">历史记录已加密，请输入密码解锁</p>
              <div class="password-input-row">
                <input type="password" id="historyPasswordInput" placeholder="输入密码...">
                <button type="button" id="historyPasswordSubmitBtn" class="btn secondary">解锁</button>
              </div>
              <p id="historyPasswordError" class="password-error" style="display: none;"></p>
            </div>
            <div id="historyImageList" class="history-image-list">
              <!-- 动态加载历史记录图片 -->
            </div>
            <div id="historyLoading" class="history-loading" style="display: none;">
              <span>加载中...</span>
            </div>
            <div id="historyEmpty" class="history-empty" style="display: none;">
              <span>暂无历史记录</span>
            </div>
            <!-- 历史记录图片上传区域 -->
            <div id="historyUploadArea" class="history-upload-area" style="display: none;">
              <div id="historySelectedPreview" class="history-selected-preview" style="display: none;">
                <img id="historySelectedImg" src="" alt="已选择的图片">
                <button type="button" id="removeHistoryImageBtn" class="remove-btn">&times;</button>
              </div>
              <div id="historyUploadStatus" class="upload-status" style="display: none;"></div>
              <button type="button" id="uploadHistoryImageBtn" class="btn secondary" style="display: none;">📤 上传到图床</button>
            </div>
          </div>
        </div>
        <button id="generateBtn" class="btn primary">
          <span class="btn-text">生成图片</span>
          <span class="btn-loading" style="display: none;">生成中...</span>
        </button>
      </div>

      <div id="resultSection" class="section" style="display: none;">
        <div class="result-image">
          <img id="resultImg" src="" alt="生成的图片">
        </div>
        <div class="result-actions">
          <button id="copyBtn" class="btn secondary">复制图片</button>
          <button id="downloadBtn" class="btn secondary">下载</button>
          <button id="uploadToAlbumBtn" class="btn secondary icon-only" style="display: none;" title="分享到相册">🔗</button>
          <button id="newBtn" class="btn primary">重新生成</button>
        </div>
        <div class="result-prompt-section">
          <button id="togglePromptBtn" class="toggle-prompt-btn">显示提示词</button>
          <div id="resultPrompt" class="result-prompt" style="display: none;"></div>
        </div>
      </div>

      <div id="errorSection" class="section" style="display: none;">
        <div class="error-message">
          <p id="errorText"></p>
        </div>
        <button id="retryBtn" class="btn primary">重试</button>
      </div>
    </main>

    <footer>
      <a href="history.html" target="_blank" class="footer-link">查看历史记录</a>
      <a href="options.html" target="_blank" class="footer-link">设置</a>
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>

</html>
